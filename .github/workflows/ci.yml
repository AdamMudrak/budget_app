name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: budgetapp
  IMAGE_NAME: budgetapp
  APP_PORT: "8081"
  JWT_ACTION_EXPIRATION: ${{ secrets.JWT_ACTION_EXPIRATION }}
  JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
  JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  SENDER_EMAIL_ADDRESS: ${{ secrets.SENDER_EMAIL_ADDRESS }}
  SUPPORT_MAIL_ADDRESS: ${{ secrets.SUPPORT_MAIL_ADDRESS }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn -B test -Dspring.profiles.active=test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t "$IMAGE_NAME:latest" .

      - name: Export Docker image
        if: github.event_name == 'push'
        run: |
          mkdir -p deploy
          docker save "$IMAGE_NAME:latest" -o "deploy/$APP_NAME.tar"

      - name: Upload image to Hetzner
        if: github.event_name == 'push'
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HETZNER_HOST }}
          REMOTE_USER: ${{ secrets.HETZNER_USER }}
          REMOTE_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          SOURCE: deploy/
          TARGET: ${{ secrets.HETZNER_DEPLOY_PATH }}
          ARGS: -rlgoDzvc

      - name: Restart container on Hetzner
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET: ${{ secrets.HETZNER_DEPLOY_PATH }}
          DOCKER_NETWORK: ${{ secrets.HETZNER_DOCKER_NETWORK }}
          SPRING_LIQUIBASE_CHANGE_LOG: /db/changelog/db.changelog-master.yaml
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          REGISTRATION_CONFIRMATION_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#/login
          PASSWORD_RESET_CONFIRMATION_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#password_update
          ACTION_ERROR_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#*
          GET_RANDOM_PASSWORD_REDIRECT_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#/login
          SERVER_PATH: https://moneta.adammudrak.pp.ua
          ORIGINS_ALLOWED: ${{ secrets.ORIGINS_ALLOWED }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          envs: APP_NAME,IMAGE_NAME,APP_PORT,TARGET,DOCKER_NETWORK,SPRING_LIQUIBASE_CHANGE_LOG,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,JWT_ACTION_EXPIRATION,JWT_ACCESS_EXPIRATION,JWT_REFRESH_EXPIRATION,JWT_SECRET,TELEGRAM_TOKEN,REGISTRATION_CONFIRMATION_LINK,PASSWORD_RESET_CONFIRMATION_LINK,ACTION_ERROR_LINK,GET_RANDOM_PASSWORD_REDIRECT_LINK,SERVER_PATH,ORIGINS_ALLOWED,SENDER_EMAIL_ADDRESS,RESEND_API_KEY,SUPPORT_MAIL_ADDRESS
          script: |
            set -e
            docker load -i "$TARGET/$APP_NAME.tar"
            docker rm -f "$APP_NAME" 2>/dev/null || true

            ENV_FILE_ARG=""
            if [ -f "$TARGET/.env" ]; then
              ENV_FILE_ARG="--env-file $TARGET/.env"
            fi

            NETWORK_ARG=""
            if [ -n "$DOCKER_NETWORK" ]; then
              NETWORK_ARG="--network $DOCKER_NETWORK"
            fi

            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              $ENV_FILE_ARG \
              $NETWORK_ARG \
              -e SERVER_PORT="$APP_PORT" \
              -e SPRING_LIQUIBASE_CHANGE_LOG="$SPRING_LIQUIBASE_CHANGE_LOG" \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              -e JWT_ACTION_EXPIRATION="$JWT_ACTION_EXPIRATION" \
              -e JWT_ACCESS_EXPIRATION="$JWT_ACCESS_EXPIRATION" \
              -e JWT_REFRESH_EXPIRATION="$JWT_REFRESH_EXPIRATION" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e TELEGRAM_TOKEN="$TELEGRAM_TOKEN" \
              -e REGISTRATION_CONFIRMATION_LINK="$REGISTRATION_CONFIRMATION_LINK" \
              -e PASSWORD_RESET_CONFIRMATION_LINK="$PASSWORD_RESET_CONFIRMATION_LINK" \
              -e ACTION_ERROR_LINK="$ACTION_ERROR_LINK" \
              -e GET_RANDOM_PASSWORD_REDIRECT_LINK="$GET_RANDOM_PASSWORD_REDIRECT_LINK" \
              -e SERVER_PATH="$SERVER_PATH" \
              -e ORIGINS_ALLOWED="$ORIGINS_ALLOWED" \
              -e SENDER_EMAIL_ADDRESS="$SENDER_EMAIL_ADDRESS" \
              -e RESEND_API_KEY="$RESEND_API_KEY" \
              -e SUPPORT_MAIL_ADDRESS="$SUPPORT_MAIL_ADDRESS" \
              -p "$APP_PORT:$APP_PORT" \
              "$IMAGE_NAME:latest"

            rm -f "$TARGET/$APP_NAME.tar"
