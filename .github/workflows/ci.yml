name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: budgetapp
  IMAGE_NAME: budgetapp
  APP_PORT: "8081"
  JWT_ACTION_EXPIRATION: ${{ secrets.JWT_ACTION_EXPIRATION }}
  JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
  JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_BOT_ENABLED: ${{ secrets.TELEGRAM_BOT_ENABLED }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  SENDER_EMAIL_ADDRESS: ${{ secrets.SENDER_EMAIL_ADDRESS }}
  SUPPORT_MAIL_ADDRESS: ${{ secrets.SUPPORT_MAIL_ADDRESS }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn -B test -Dspring.profiles.active=test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t "$IMAGE_NAME:latest" .

      - name: Deploy application on Hetzner
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_APP_DEPLOY_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          SPRING_LIQUIBASE_CHANGE_LOG: /db/changelog/db.changelog-master.yaml
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          REGISTRATION_CONFIRMATION_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#/login
          PASSWORD_RESET_CONFIRMATION_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#password_update
          ACTION_ERROR_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#*
          GET_RANDOM_PASSWORD_REDIRECT_LINK: https://mariashmakova-frontend.moneta.adammudrak.pp.ua/#/login
          SERVER_PATH: https://moneta.adammudrak.pp.ua
          ORIGINS_ALLOWED: ${{ secrets.ORIGINS_ALLOWED }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' 'hetzner-portfolio ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMrovpL5gc3TM4fs2+cVTggnYomFUO+ex9st5t1GHlB5' > ~/.ssh/known_hosts
          key="$HOME/.ssh/hetzner_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"

          image="$APP_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:latest" "$image"
          {
            python3 -c 'import json, os, sys; print(json.dumps({key: os.environ[key].strip() for key in sys.argv[1:] if os.environ.get(key, "").strip()}))' SPRING_LIQUIBASE_CHANGE_LOG SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD JWT_ACTION_EXPIRATION JWT_ACCESS_EXPIRATION JWT_REFRESH_EXPIRATION JWT_SECRET TELEGRAM_TOKEN TELEGRAM_BOT_ENABLED REGISTRATION_CONFIRMATION_LINK PASSWORD_RESET_CONFIRMATION_LINK ACTION_ERROR_LINK GET_RANDOM_PASSWORD_REDIRECT_LINK SERVER_PATH ORIGINS_ALLOWED SENDER_EMAIL_ADDRESS RESEND_API_KEY SUPPORT_MAIL_ADDRESS
            docker save "$image"
          } | ssh -T -p "$HETZNER_PORT" -i "$key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=hetzner-portfolio -o HostKeyAlgorithms=ssh-ed25519 \
            "root@$HETZNER_HOST" "deploy $GITHUB_SHA"
